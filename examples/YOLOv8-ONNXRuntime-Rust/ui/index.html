<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --glass-bg: rgba(15, 15, 20, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.4);
        }
        
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-primary);
        }
        
        html {
            background: #0a0a0f;
        }
        
        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #0a0a0f;
            overflow: hidden;
        }
        
        /* Canvas 容器 - 支持缩放和拖拽 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 视频画布 - 保持原始比例，居中显示 */
        #canvas {
            position: absolute;
            /* 不设置固定尺寸，由 JS 设置实际像素尺寸 */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: transparent;
            will-change: transform;
            transform-origin: center center;
        }
        
        /* 非混合模式的后备背景 */
        #canvas.fallback-mode {
            background: #0a0a0f;
        }
        
        /* 缩放指示器 */
        #zoom-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 50;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        #zoom-level {
            min-width: 45px;
            text-align: center;
            font-weight: 600;
            color: var(--accent-light);
        }
        
        #zoom-indicator button {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        #zoom-indicator button:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }
        
        /* ========== 现代控制面板 ========== */
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 340px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            z-index: 100;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        
        #control-panel:hover {
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6),
                        0 0 1px rgba(255, 255, 255, 0.15) inset;
        }
        
        /* 标题栏 */
        .panel-header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            cursor: move;
            user-select: none;
        }
        
        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .panel-title h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        
        .panel-title span {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        #toggle-btn {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #toggle-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }
        
        #control-panel.collapsed #toggle-btn {
            transform: rotate(180deg);
        }
        
        /* 面板主体 */
        #panel-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 800px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        #control-panel.collapsed #panel-body {
            max-height: 0;
            padding: 0 16px;
            opacity: 0;
            pointer-events: none;
        }
        
        /* ========== 实时统计卡片 ========== */
        .stats-card {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            transition: all 0.2s ease;
        }
        
        .stat-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }
        
        .stat-item .value {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        
        .stat-item .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        
        /* ========== 输入区域 ========== */
        .input-group {
            position: relative;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 80px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            transition: all 0.2s ease;
        }
        
        .input-group input::placeholder {
            color: var(--text-muted);
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        
        .input-actions {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 4px;
        }
        
        .input-actions button {
            width: 30px;
            height: 30px;
            padding: 0;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .input-actions button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }
        
        /* 历史下拉 */
        #history-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(20, 20, 28, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }
        
        #history-dropdown.show {
            display: block;
            animation: dropIn 0.2s ease;
        }
        
        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .history-item {
            padding: 12px 14px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            border-bottom: 1px solid var(--glass-border);
            transition: all 0.15s ease;
        }
        
        .history-item:last-child { border-bottom: none; }
        
        .history-item:hover {
            background: rgba(99, 102, 241, 0.15);
            color: var(--text-primary);
        }
        
        /* ========== 按钮组 ========== */
        .btn-group {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }
        
        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(239, 68, 68, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }
        
        .btn-accent:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
        }
        
        /* ========== 设置区域 ========== */
        .settings-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
        }
        
        .settings-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .settings-row + .settings-row {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
        }
        
        .settings-label {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 60px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .settings-label .icon {
            font-size: 14px;
        }
        
        select {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        select option {
            background: #1a1a24;
            color: var(--text-primary);
        }
        
        /* 音量滑块 */
        .slider-control {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        input[type="range"] {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        
        .slider-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-light);
            min-width: 36px;
            text-align: right;
        }
        
        /* ========== 状态提示 ========== */
        #status {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            z-index: 100;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        
        #status.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        /* 隐藏类 */
        .hidden { display: none !important; }
        
        /* wgpu 渲染模式 - 透明背景 */
        body.wgpu-mode {
            background: transparent !important;
        }
        
        body.wgpu-mode html,
        body.wgpu-mode #app {
            background: transparent !important;
        }
        
        body.wgpu-mode #canvas-container {
            background: transparent !important;
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body>
    <div id="app">
        <!-- Canvas 容器，支持缩放和拖拽 -->
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
        
        <!-- 缩放指示器 -->
        <div id="zoom-indicator">
            <span id="zoom-level">100%</span>
            <button id="zoom-reset" title="重置视图 (双击)">⟳</button>
            <button id="zoom-fit" title="适应窗口">⊡</button>
        </div>
        
        <!-- 现代控制面板 -->
        <div id="control-panel">
            <div class="panel-header" id="panel-header">
                <div class="panel-title">
                    <div class="logo">👁</div>
                    <div>
                        <h1>YOLO Vision</h1>
                        <span>LLM Inference</span>
                    </div>
                </div>
                <button id="toggle-btn" title="折叠">▲</button>
            </div>
            
            <div id="panel-body">
                <!-- 实时统计 -->
                <div class="stats-card">
                    <div class="stat-item">
                        <div class="value" id="fps">0</div>
                        <div class="label">Video FPS</div>
                    </div>
                    <div class="stat-item">
                        <div class="value" id="latency">0<small style="font-size:12px">ms</small></div>
                        <div class="label">Latency</div>
                    </div>
                </div>
                
                <!-- RTSP 输入 -->
                <div class="input-group">
                    <input type="text" id="rtsp-url" placeholder="rtsp://username:password@host:port/path">
                    <div class="input-actions">
                        <button id="history-toggle" title="历史记录">▼</button>
                        <button id="clear-history" title="清空">🗑</button>
                    </div>
                    <div id="history-dropdown"></div>
                </div>
                
                <!-- 流控制按钮 -->
                <div class="btn-group">
                    <button id="start-btn" class="btn btn-primary">
                        <span>▶</span> 播放
                    </button>
                    <button id="stop-btn" class="btn btn-danger hidden">
                        <span>⏹</span> 停止
                    </button>
                </div>
                
                <!-- 音量控制 -->
                <div class="settings-section">
                    <div class="settings-row">
                        <div class="settings-label">
                            <span class="icon">🔊</span> 音量
                        </div>
                        <div class="slider-control">
                            <input type="range" id="volume-slider" min="0" max="5" step="0.1" value="1.5">
                            <span class="slider-value" id="volume-value">1.5×</span>
                        </div>
                    </div>
                </div>
                
                <!-- LLM 推理设置 -->
                <div class="settings-section" id="llm-settings">
                    <div class="settings-row">
                        <div class="settings-label">
                            <span class="icon">🤖</span> LLM 推理
                        </div>
                        <button id="llm-config-toggle" class="btn btn-sm" style="padding: 4px 12px; font-size: 12px;">配置</button>
                    </div>
                    
                    <!-- LLM 配置面板（默认隐藏） -->
                    <div id="llm-config-panel" class="hidden" style="margin-top: 8px;">
                        <div class="settings-row" style="flex-direction: column; align-items: stretch; gap: 8px;">
                            <input type="text" id="llm-api-url" placeholder="API URL (如: http://localhost:11434/api/chat)" 
                                   style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 12px;">
                            <input type="text" id="llm-model" placeholder="模型名称 (如: llava, gpt-4-vision)" 
                                   style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 12px;">
                            <textarea id="llm-system-prompt" placeholder="系统提示词 (可选)" rows="2"
                                      style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 12px; resize: vertical;"></textarea>
                            <textarea id="llm-user-prompt" placeholder="用户提示词 (如: 描述这张图片中的内容)" rows="2"
                                      style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 12px; resize: vertical;">描述这张监控画面中的场景和活动</textarea>
                            <div style="display: flex; gap: 8px;">
                                <div style="flex: 1;">
                                    <label style="font-size: 11px; color: rgba(255,255,255,0.6);">分析间隔(秒)</label>
                                    <input type="number" id="llm-frame-interval" value="2" min="0.5" max="60" step="0.5"
                                           style="width: 100%; padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 12px;">
                                </div>
                                <div style="flex: 1;">
                                    <label style="font-size: 11px; color: rgba(255,255,255,0.6);">Temperature</label>
                                    <input type="number" id="llm-temperature" value="0.7" min="0" max="2" step="0.1"
                                           style="width: 100%; padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 12px;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- LLM 控制按钮 -->
                <div class="btn-group">
                    <button id="start-llm-btn" class="btn" style="background: linear-gradient(135deg, #9333ea, #7c3aed);">
                        <span>🤖</span> 开启LLM推理
                    </button>
                    <button id="stop-llm-btn" class="btn btn-danger hidden">
                        <span>⏹</span> 停止LLM推理
                    </button>
                </div>
                
                <!-- LLM 推理输出 -->
                <div id="llm-output-container" class="hidden" style="margin-top: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.7);">🤖 LLM 分析结果</span>
                        <button id="llm-clear-output" style="padding: 2px 8px; font-size: 11px; background: rgba(255,255,255,0.1); border: none; border-radius: 4px; color: rgba(255,255,255,0.6); cursor: pointer;">清空</button>
                    </div>
                    <div id="llm-output" style="max-height: 200px; overflow-y: auto; padding: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.9); white-space: pre-wrap; word-break: break-word;"></div>
                </div>
            </div>
        </div>
        
        <div id="status"></div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
