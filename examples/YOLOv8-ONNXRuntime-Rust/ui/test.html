<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试页面</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: #fff; 
            font-family: monospace;
        }
        #info { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(0,0,0,0.8); 
            padding: 10px;
            z-index: 100;
        }
        canvas { 
            display: block; 
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>状态: <span id="status">初始化中...</span></div>
        <div>帧计数: <span id="count">0</span></div>
        <div>尺寸: <span id="size">0x0</span></div>
    </div>
    <canvas id="canvas"></canvas>
    
    <script type="module">
        import { invoke } from '@tauri-apps/api/core';
        import { listen } from '@tauri-apps/api/event';
        
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const countEl = document.getElementById('count');
        const sizeEl = document.getElementById('size');
        
        let frameCount = 0;
        
        console.log('🚀 初始化 WebGL...');
        const gl = canvas.getContext('webgl2');
        
        if (!gl) {
            status.textContent = '❌ WebGL2 不支持';
            console.error('WebGL2 not supported');
        } else {
            status.textContent = '✅ WebGL2 已就绪';
            console.log('✅ WebGL2 context created');
            
            // 创建简单的纹理
            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            
            // 监听帧事件
            console.log('📡 设置事件监听器...');
            listen('frame-ready', (event) => {
                console.log('📦 收到 frame-ready 事件:', event.payload);
                renderFrame();
            });
            
            // 轮询帧数据
            async function renderFrame() {
                try {
                    const [buffer, width, height] = await invoke('get_latest_frame');
                    
                    if (!buffer || buffer.length === 0) {
                        console.warn('⚠️ 空帧');
                        return;
                    }
                    
                    console.log(`✅ 收到帧: ${width}x${height}, ${buffer.length} bytes`);
                    
                    // 更新 Canvas 尺寸
                    if (canvas.width !== width || canvas.height !== height) {
                        canvas.width = width;
                        canvas.height = height;
                        gl.viewport(0, 0, width, height);
                        sizeEl.textContent = `${width}x${height}`;
                    }
                    
                    // 上传纹理
                    const data = new Uint8Array(buffer);
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
                    
                    // 清屏并显示纹理(简单的全屏填充)
                    gl.clearColor(1, 0, 0, 1); // 红色背景用于调试
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    
                    frameCount++;
                    countEl.textContent = frameCount;
                    status.textContent = '▶️ 播放中';
                    
                    await invoke('mark_frame_processed');
                    
                } catch (err) {
                    console.error('❌ 渲染错误:', err);
                    status.textContent = '❌ 错误: ' + err;
                }
            }
            
            // 开始轮询
            setInterval(async () => {
                try {
                    const hasNew = await invoke('has_new_frame');
                    if (hasNew) {
                        await renderFrame();
                    }
                } catch (err) {
                    // 忽略轮询错误
                }
            }, 16); // 60 FPS
            
            console.log('✅ 初始化完成,等待帧数据...');
        }
    </script>
</body>
</html>
