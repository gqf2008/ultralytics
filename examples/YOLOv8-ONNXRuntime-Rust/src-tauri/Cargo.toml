[package]
name = "yolov8-sentinel-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "yolov8_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["unstable"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
retina = "0.4"                                       # 纯 Rust RTSP 客户端 (无 FFmpeg 依赖!)
url = "2"                                            # URL 解析
parking_lot = "0.12"
crossbeam-channel = "0.5"

# 不依赖主项目! Tauri 版本独立运行,WebView 负责解码
# 用 retina 替代 ffmpeg-next,避免 QSV/x264 链接错误
