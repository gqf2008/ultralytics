[package]
name = "yolov8-sentinel-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "yolov8_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["unstable"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
# retina = "0.4"                                     # 仅 RTSP (已弃用)
url = "2"            # URL 解析
parking_lot = "0.12"

# FFmpeg - 支持所有流媒体协议 (RTSP/RTMP/HLS/HTTP-FLV/文件等)
ffmpeg-next = "7"
crossbeam-channel = "0.5"

# ONNX Runtime - 直接引入，不依赖主项目 (避免 FFmpeg 链接)
ort = { version = "2.0.0-rc.5", features = [
    "cuda",
    "directml",
    "download-binaries",
    "copy-dylibs",
] }
ndarray = "0.16"

# 图像处理
image = "0.25"
rayon = "1.10"

# Windows 共享内存
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
] }
