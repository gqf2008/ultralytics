[package]
name = "yolov8-sentinel-tauri"
version = "0.1.0"
edition = "2021"
default-run = "yolov8-sentinel-tauri"

[lib]
name = "yolov8_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["unstable"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
retina = "0.4"                                       # 纯 Rust RTSP 客户端 (无 FFmpeg 依赖!)
url = "2"                                            # URL 解析
parking_lot = "0.12"
crossbeam-channel = "0.5"

# ONNX Runtime - 直接引入，不依赖主项目 (避免 FFmpeg 链接)
ort = { version = "2.0.0-rc.5", features = [
    "cuda",
    "directml",
    "download-binaries",
    "copy-dylibs",
] }
ndarray = "0.16"

# 图像处理
image = "0.25"
rayon = "1.10"
base64 = "0.22"

# HTTP 客户端 (用于 LLM API 调用)
ureq = { version = "2", features = ["json"] }

# 字体渲染 (用于检测框标签)
fontdue = "0.9"

# FFmpeg H.265 硬件解码 (QSV/CUDA) - 仅用于 RTSP 解码
ffmpeg-next = "7.0"
crossbeam-skiplist = "0.1.3"

# Windows 共享内存 API
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
] }

# Unix 共享内存 (Linux/macOS)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
