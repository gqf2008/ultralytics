[package]
name = "yolov8-sentinel-tauri"
version = "0.1.0"
edition = "2021"
default-run = "yolov8-sentinel-tauri"

[lib]
name = "yolov8_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["unstable"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
retina = "0.4"                                       # 纯 Rust RTSP 客户端 (无 FFmpeg 依赖!)
url = "2"                                            # URL 解析
parking_lot = "0.12"
crossbeam-channel = "0.5"

# ONNX Runtime - 直接引入，不依赖主项目 (避免 FFmpeg 链接)
ort = { version = "2.0.0-rc.5", features = [
    "cuda",
    "directml",
    "download-binaries",
    "copy-dylibs",
] }
ndarray = "0.16"

# 图像处理
image = "0.25"
rayon = "1.10"
base64 = "0.22"

# HTTP 客户端 (用于 LLM API 调用)
ureq = { version = "2", features = ["json"] }

# HTTP 异步客户端 (用于 HTTP-FLV 流)
reqwest = { version = "0.12", features = ["stream"] }

# AMF0/AMF3 解析 (用于 FLV onMetaData)
amf = "1.0"

# 字体渲染 (用于检测框标签)
fontdue = "0.9"

# FFmpeg H.265 硬件解码 (QSV/CUDA) - 仅用于 RTSP 解码
ffmpeg-next = "7.0"
crossbeam-skiplist = "0.1.3"

# 屏幕/窗口捕获 (跨平台)
xcap = "0.7"

# wgpu 零拷贝 GPU 渲染 (直接渲染到窗口 native handle)
wgpu = "23"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"                                       # 异步阻塞等待
raw-window-handle = "0.6"                              # 原生窗口句柄
winit = "0.30"                                         # 独立窗口创建 (用于 wgpu 渲染窗口)

# Windows 共享内存 API + Windows Graphics Capture
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
] }

# Windows Graphics Capture API (用于窗口捕获，支持后台/遮挡窗口)
windows = { version = "0.61", features = [
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Foundation",
    "Foundation_Collections",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

# Unix 共享内存 (Linux/macOS)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
