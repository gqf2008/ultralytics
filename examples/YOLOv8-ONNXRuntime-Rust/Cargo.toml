[package]
name = "yolov8-rs"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = ["wgpu", "pollster", "futures", "bytemuck"]


# 多个可执行文件
[[bin]]
name = "yolov8"            # 图片检测: cargo run --bin yolov8
path = "src/bin/yolov8.rs"

[[bin]]
name = "sentinel"         # 数字卫兵 RTSP 实时监控 (macroquad): cargo run --bin sentinel-mq --release
path = "src/bin/sentinel.rs"

# 示例程序
[[example]]
name = "affine_transform_demo"
path = "examples/affine_transform_demo.rs"

[[example]]
name = "affine_benchmark"
path = "examples/affine_benchmark.rs"

[[example]]
name = "affine_gpu_benchmark"
path = "examples/affine_gpu_benchmark.rs"
required-features = ["gpu"]

[[example]]
name = "gpu_simple_demo"
path = "examples/gpu_simple_demo.rs"
required-features = ["gpu"]

[[example]]
name = "gpu_image_test"
path = "examples/gpu_image_test.rs"
required-features = ["gpu"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.2.4", features = ["derive"] }
image = { version = "0.25.2" }
imageproc = { version = "0.25.0" }
ndarray = { version = "0.16" }
ort = { version = "2.0.0-rc.5", features = [
    "cuda",
    "tensorrt",
    "download-binaries",
    "copy-dylibs",
    "half",
] }
rusttype = { version = "0.9.3" }
anyhow = { version = "1.0.75" }
regex = { version = "1.5.4" }
rand = { version = "0.8.5" }
chrono = { version = "0.4.30" }
half = { version = "2.3.1" }
dirs = { version = "5.0.1" }
ureq = { version = "2.9.1" }
ab_glyph = "0.2.29"

# FFmpeg 原生 API - 零拷贝解码 (统一使用 Rust 风格封装)
ffmpeg-next = "7.0"

# 高性能图像缩放
fast_image_resize = { version = "5.3.0" }

# 2D游戏框架 (GPU加速渲染)
macroquad = "0.4"

# egui UI框架集成
egui-macroquad = "0.17"

# SDL2 原生 YUV 纹理支持 (对标 ffplay)
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }

# 线程间通信
crossbeam-channel = "0.5.15"
crossbeam-skiplist = "0.1.3"

# 数据并行处理
rayon = "1.10"
crossbeam = "0.8.4"

# Windows 剪贴板支持
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi_Common",
] }

# 高性能内存分配器 (替代系统默认分配器)
mimalloc = { version = "0.1", default-features = false }

# 全局静态变量支持
once_cell = "1.20"
phf = { version = "0.13.1", features = ["macros"] }

# JSON序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# GPU加速 (可选功能)
wgpu = { version = "22.0", optional = true }
pollster = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
bytemuck = { version = "1.14", optional = true, features = ["derive"] }

[build-dependencies]
phf = { version = "0.13.1", default-features = false }
phf_codegen = "0.13.1"
